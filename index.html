<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camp Site - Scanner Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
    .scanner-card { background: #1e293b; border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    #qr-reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
  </style>
</head>
<body>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card scanner-card p-4">
          <div class="text-center mb-3">
            <i class="bi bi-qr-code-scan text-warning display-5"></i>
            <h4 class="fw-bold mt-2">Camp Site Scanner</h4>
            <p class="text-muted small">Pindai ID Card Karyawan untuk Makan & Amenities</p>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Jenis Transaksi</label>
            <select class="form-select bg-dark text-white border-secondary" id="targetModul" onchange="toggleModulOptions()">
              <option value="catering">1. Pembagian Makan (Catering)</option>
              <option value="amenities">2. Pembagian Amenities</option>
            </select>
          </div>

          <div class="mb-3" id="cateringOptions">
            <label class="form-label small fw-bold text-secondary">Sesi Waktu Makan</label>
            <select class="form-select bg-dark text-white border-secondary fw-bold text-warning" id="sesiMakan">
              <option value="Pagi">1. Makan Pagi (Breakfast)</option>
              <option value="Siang">2. Makan Siang (Lunch)</option>
              <option value="Sore">3. Makan Sore (Dinner)</option>
              <option value="Tengah Malam">4. Makan Tengah Malam (Supper)</option>
            </select>
          </div>

          <div class="mb-3 d-none" id="amenitiesOptions">
            <label class="form-label small fw-bold text-secondary">Paket Amenities</label>
            <select class="form-select bg-dark text-white border-secondary" id="paketAmenities">
              <option value="Paket Lengkap Bulanan (Sabun Mandi, Cuci, Kopi, Gula)">Paket Lengkap Bulanan</option>
              <option value="Paket Toiletries (Sabun Mandi & Cuci)">Paket Toiletries</option>
              <option value="Paket Pantry (Kopi & Gula)">Paket Pantry</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Pilih Kamera</label>
            <select id="cameraSelect" class="form-select form-select-sm bg-dark text-white border-secondary mb-2" onchange="changeCamera()"></select>
            <div id="qr-reader"></div>
          </div>

          <div id="scanStatus" class="text-center small text-info fw-semibold mb-2">Menyiapkan kamera...</div>

          <!-- Input Manual / Alat Tes Koneksi Cepat -->
          <div class="input-group input-group-sm mt-3">
            <input type="text" id="manualNikInput" class="form-control bg-dark text-white border-secondary" placeholder="Ketik NIK manual (Contoh: EMP-001)">
            <button class="btn btn-warning fw-bold" type="button" onclick="triggerManualScan()">Kirim Manual</button>
          </div>
          
          <div class="text-center mt-3">
            <button class="btn btn-outline-light btn-sm w-100" onclick="history.back()">
              <i class="bi bi-arrow-left me-1"></i> Kembali ke Menu Utama
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    // Pastikan URL ini sesuai dengan URL Aplikasi Web pada menu Kelola Deployment Anda
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzELR_ih6qBuJmX7IZfcOdd9PMrsJr7jCDWOUExit56sA_ZUxzvTUQ0lr4kGu0XeBLZFQ/exec";

    let html5QrCode = null;
    let isProcessing = false;

    document.addEventListener("DOMContentLoaded", () => {
      initScanner();
    });

    function toggleModulOptions() {
      const val = document.getElementById("targetModul").value;
      if (val === "catering") {
        document.getElementById("cateringOptions").classList.remove("d-none");
        document.getElementById("amenitiesOptions").classList.add("d-none");
      } else {
        document.getElementById("cateringOptions").classList.add("d-none");
        document.getElementById("amenitiesOptions").classList.remove("d-none");
      }
    }

    function playBeepSuccess() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    function playBuzzerDuplicate() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(220, ctx.currentTime);
        gain1.gain.setValueAtTime(0.3, ctx.currentTime);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start();
        osc1.stop(ctx.currentTime + 0.18);

        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(180, ctx.currentTime);
          gain2.gain.setValueAtTime(0.35, ctx.currentTime);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start();
          osc2.stop(ctx.currentTime + 0.25);
        }, 220);
      } catch (e) {}
    }

    function initScanner() {
      Html5Qrcode.getCameras().then(devices => {
        const selectEl = document.getElementById("cameraSelect");
        selectEl.innerHTML = "";
        if (devices && devices.length > 0) {
          devices.forEach((dev, idx) => {
            const opt = document.createElement("option");
            opt.value = dev.id;
            opt.text = dev.label || `Kamera ${idx + 1}`;
            selectEl.appendChild(opt);
          });
          startCamera(devices[0].id);
        } else {
          document.getElementById("scanStatus").innerText = "Tidak ada kamera ditemukan.";
        }
      }).catch(err => {
        document.getElementById("scanStatus").innerHTML = `<span class="text-danger">Akses kamera diblokir browser. Gunakan input manual di bawah.</span>`;
      });
    }

    function startCamera(cameraId) {
      if (html5QrCode) html5QrCode.clear();
      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        cameraId,
        { fps: 15, qrbox: { width: 220, height: 220 } },
        onScanSuccess,
        err => {}
      ).then(() => {
        document.getElementById("scanStatus").innerText = "Kamera aktif. Silakan arahkan QR Code ID Card.";
      });
    }

    function changeCamera() {
      const selectedId = document.getElementById("cameraSelect").value;
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => startCamera(selectedId));
      } else {
        startCamera(selectedId);
      }
    }

    function triggerManualScan() {
      const val = document.getElementById("manualNikInput").value.trim();
      if (!val) return;
      onScanSuccess(val);
      document.getElementById("manualNikInput").value = "";
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const scannedNik = decodedText.replace(/[\r\n\t]/g, '').trim().toUpperCase();
      const modul = document.getElementById("targetModul").value;
      const sesi = document.getElementById("sesiMakan").value;
      const paket = document.getElementById("paketAmenities").value;

      if (html5QrCode && html5QrCode.isScanning) {
        try { html5QrCode.pause(); } catch (e) {}
      }

      Swal.fire({
        title: 'Memeriksa Data...',
        text: `NIK: ${scannedNik}`,
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      const payload = {
        action: modul,
        nik: scannedNik,
        sesi: sesi,
        itemPaket: paket,
        qty: 1
      };

      try {
        // KUNCI UTAMA: credentials: 'omit' mencegah konflik multi-akun Google Drive!
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit',
          redirect: 'follow',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const rawText = await response.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (jsonErr) {
          throw new Error("Respon server bukan JSON. Pastikan akses Web App disetel ke 'Siapa saja'.");
        }

        handleResponseData(data);
      } catch (postErr) {
        // Fallback ke metode GET dengan credentials: 'omit' jika POST terhalang jaringan
        try {
          const query = new URLSearchParams({
            action: modul,
            nik: scannedNik,
            sesi: sesi,
            itemPaket: paket,
            qty: '1',
            t: Date.now()
          });
          const getRes = await fetch(`${GAS_WEB_APP_URL}?${query.toString()}`, {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            redirect: 'follow'
          });
          const data = await getRes.json();
          handleResponseData(data);
        } catch (getErr) {
          Swal.fire({
            icon: 'error',
            title: 'Gagal Terhubung ke Server',
            html: `<p class="small mb-1">${getErr.message}</p>
                   <small class="text-danger">Pastikan URL Web App di kode ini sama persis dengan URL di Kelola Deployment!</small>`,
            confirmButtonColor: '#0f172a'
          }).then(() => resumeScanner());
        }
      }
    }

    function handleResponseData(data) {
      if (data.status === 'success') {
        playBeepSuccess();
        Swal.fire({
          icon: 'success',
          title: 'BERHASIL DIAMBIL',
          html: `<h4 class="text-primary fw-bold">${data.nama}</h4>
                 <p class="text-muted mb-0">${data.message}</p>`,
          timer: 2000,
          showConfirmButton: false
        }).then(() => resumeScanner());
      } else if (data.status === 'warning' || data.duplicate) {
        playBuzzerDuplicate();
        Swal.fire({
          icon: 'error',
          title: 'DITOLAK: SUDAH AMBIL MAKAN!',
          html: `<div class="py-2">
                   <h3 class="text-danger fw-bold mb-2">${data.nama}</h3>
                   <p class="mb-1 text-dark">Sudah mengambil makan <strong>${data.sesi}</strong> hari ini.</p>
                   <span class="badge bg-danger fs-6 p-2 mt-2">Tercatat Pukul: ${data.waktu}</span>
                 </div>`,
          confirmButtonColor: '#ef4444',
          confirmButtonText: 'Tutup / Lanjutkan Scan'
        }).then(() => resumeScanner());
      } else {
        Swal.fire({
          icon: 'warning',
          title: 'Peringatan',
          text: data.message || 'Terjadi kesalahan sistem',
          confirmButtonColor: '#0f172a'
        }).then(() => resumeScanner());
      }
    }

    function resumeScanner() {
      isProcessing = false;
      if (html5QrCode) {
        try { html5QrCode.resume(); } catch (e) {}
      }
    }
  </script>
</body>
</html>
